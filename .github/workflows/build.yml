name: build

# Builds OpenAmigaGCC from scripts/sources.lock with every patch, runs
# build.sh's own checks, the qemu-m68k reproducers, the lean C++ check, and
# compiles the C++ runtime and libpthread tests (they need a real AmigaOS to
# run). The NDK is downloaded at build time (scripts/ndk.lock) and never kept.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish this build as a release, e.g. 16.2.0-open4 (needs docs/releases/<version>.md); empty builds only'
        required: false
        default: ''

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# The build runs third-party sources and this PR's own scripts for hours,
# so its token can only read; publishing is a job of its own, with write,
# that runs none of them.
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Room for the release tarballs
        if: inputs.release != ''
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h "$RUNNER_TEMP"

      - name: Folders
        run: |
          echo "WORK=$RUNNER_TEMP/work" >> "$GITHUB_ENV"
          echo "PREFIX=$RUNNER_TEMP/prefix" >> "$GITHUB_ENV"
          echo "NDKDIR=$RUNNER_TEMP/ndk" >> "$GITHUB_ENV"

      - name: Host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bison flex gperf texinfo \
            libgmp-dev libmpfr-dev libmpc-dev rsync git lhasa autoconf gettext \
            libncurses-dev libreadline-dev qemu-user python3

      - name: Fetch sources
        run: scripts/fetch.sh "$WORK"

      - name: Fetch the NDK
        run: scripts/fetch-ndk.sh "$NDKDIR"

      - name: Build
        run: scripts/build.sh "$WORK" "$PREFIX" "$NDKDIR/NDK3.2.lha" "$(nproc)"

      - name: Reproducers under qemu-m68k
        run: |
          tests/repro/prove.sh "$PREFIX/bin"
          tests/repro/prove.sh "$PREFIX/bin" -fno-tree-loop-distribute-patterns

      - name: Built libnix end-pointer control under qemu-m68k
        run: tests/libnix/endptr/run.sh "$PREFIX/bin"

      - name: Lean C++ check
        run: CXX="$PREFIX/bin/m68k-amigaos-g++" NM="$PREFIX/bin/m68k-amigaos-nm" tests/cxx/lean-check.sh

      - name: Base-relative C++ exception data
        run: tests/baserel/eh-check.sh "$PREFIX"

      - name: Compile the AmigaOS-only tests
        run: |
          set -e
          O=$RUNNER_TEMP/amiga-tests; mkdir -p "$O"
          CXX="$PREFIX/bin/m68k-amigaos-g++"
          FL="-m68040 -m68881 -O2 -fomit-frame-pointer -std=gnu++23"
          $CXX $FL -o "$O/dtors" tests/cxx/dtors.cpp -lpthread
          for t in tests/pthreads/*.cpp; do
            $CXX $FL -o "$O/$(basename "$t" .cpp)" "$t" -lpthread -latomic -lstdc++
          done
          "$PREFIX/bin/m68k-amigaos-gcc" -m68040 -m68881 -O2 -o "$O/setlocale_threads" tests/libnix/setlocale_threads.c -lpthread -lm
          "$PREFIX/bin/m68k-amigaos-gcc" -m68040 -m68881 -O2 -o "$O/strtol_endptr" tests/libnix/strtol_endptr.c
          ls -l "$O"

      - name: Package
        if: inputs.release != ''
        run: |
          test -f "docs/releases/${{ inputs.release }}.md"
          scripts/package.sh "$WORK" "$PREFIX" "$RUNNER_TEMP/out" "${{ inputs.release }}"
          ls -l "$RUNNER_TEMP/out"

      - name: Keep the release files for the release job
        if: inputs.release != ''
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/out/
          retention-days: 1
          if-no-files-found: error

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            ${{ env.WORK }}/openamigagcc-logs
            ${{ env.WORK }}/log

  release:
    needs: build
    if: inputs.release != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/out

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ inputs.release }}
        run: |
          cd "$RUNNER_TEMP/out" && sha256sum -c SHA256SUMS && cd "$GITHUB_WORKSPACE"
          gh release create "v$V" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "OpenAmigaGCC $V" --notes-file "docs/releases/$V.md" \
            "$RUNNER_TEMP/out/openamigagcc-$V-x86_64-linux.tar.xz" \
            "$RUNNER_TEMP/out/openamigagcc-$V-src.tar.xz" "$RUNNER_TEMP/out/SHA256SUMS"
